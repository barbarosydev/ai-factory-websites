# Thin task runner: every task calls one script in scripts/, where the logic lives.
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  lint:
    desc: Run shellcheck, ruff, JS/spec.json checks, external-URL scan, Conftest policies, actionlint, and doc checks
    cmds:
      - ./scripts/lint.sh

  test:
    desc: "Run hook tests and 11 Playwright + WCAG 2.1 AA quality gates (SITE_SLUG=<slug> or ALL_SITES=1)"
    cmds:
      - ./scripts/test.sh {{.CLI_ARGS}}

  ci:
    desc: Run task lint, task test, and gitleaks secret scan (pre-commit and GitHub Actions)
    cmds:
      - ./scripts/ci.sh {{.CLI_ARGS}}

  preview:
    desc: "Serve the interactive Showcase Portal (default) or a single site (SITE_SLUG=<slug> task preview -- --open)"
    cmds:
      - node ./scripts/serve.mjs {{.CLI_ARGS}}

  portal:
    desc: Build the static Showcase Portal bundle in dist/ from sites/*/spec.json
    cmds:
      - ./scripts/portal.sh {{.CLI_ARGS}}

  setup:labels:
    desc: Create or update all factory:* labels on GitHub using gh CLI
    cmds:
      - ./scripts/setup-labels.sh
