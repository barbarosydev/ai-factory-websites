name: Modify an Existing Website
description: Request updates to an existing website under sites/<slug>/.
title: "[Modify Site]: "
labels:
  - "factory:ready"
body:
  - type: markdown
    attributes:
      value: |
        Update an existing website in `sites/`. Check the [Sites Catalog](https://github.com/barbarosydev/ai-factory-websites#sites-catalog) for exact slugs (`lowercase-kebab-case`).
        - **Lifecycle**: `factory:ready` -> `factory:running` -> `factory:review` PR with refreshed Desktop & Mobile screenshots.
  - type: input
    id: site_slug
    attributes:
      label: Target Site Slug
      description: Exact directory name under `sites/` (lowercase kebab-case, e.g. `kaffeekultur-berlin`).
      placeholder: kaffeekultur-berlin
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Requested Changes
      description: Describe what to add, change, or remove.
      placeholder: Add a seasonal winter drinks section and update the primary theme color to forest green.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Must-Keep / Constraints (optional)
      description: Existing sections, UTF-8 facts (e.g. street names), or styles that must remain unchanged.
      placeholder: Keep existing opening hours and Oranienstraße 42 Berlin-Kreuzberg address unchanged.
